name: locallists
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  another_flutter_splash_screen: ^1.2.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  app_settings: ^6.1.1
  state_notifier: ^1.0.0
  flutter_state_notifier: ^1.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/splashscreen/
    - assets/icons/
    - assets/icons/android/